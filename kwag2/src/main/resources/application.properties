# ===== Application Configuration =====
app.name=KWAG2 - SaaS Framework
app.version=0.0.1-SNAPSHOT
app.description=SaaS 멀티테넌트 기반 전자정부프레임워크

# ===== Logging Configuration =====
logging.level.root=INFO
logging.level.kr.sy.kwag2=DEBUG
logging.level.org.springframework=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.mybatis=DEBUG

# ===== Swagger Configuration =====
swagger.enabled=true
swagger.title=KWAG2 API Documentation
swagger.description=SaaS 멀티테넌트 프레임워크 API
swagger.version=${app.version}
swagger.contact.name=Development Team
swagger.contact.url=http://example.com
swagger.contact.email=dev@example.com

# ===== Database Configuration (Default: MySQL) =====
# 기본 데이터베이스 설정
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/kwag2?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
jdbc.username=root
jdbc.password=root
jdbc.pool.max=20
jdbc.pool.min=5

# 보조 데이터베이스 설정 (다중 DB 지원)
jdbc.secondary.driver=com.mysql.cj.jdbc.Driver
jdbc.secondary.url=jdbc:mysql://localhost:3306/kwag2_secondary?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
jdbc.secondary.username=root
jdbc.secondary.password=root

# ===== File Upload Configuration =====
file.upload.path=/data/uploads
file.upload.max-size=52428800
file.upload.temp-path=/data/temp

# ===== Session Configuration =====
session.timeout=1800
session.cookie.secure=false
session.cookie.httponly=true

# ===== MultiTenant Configuration =====
multitenant.enabled=true
multitenant.header-name=X-Tenant-ID
multitenant.cookie-name=tenantId
multitenant.default-tenant=default