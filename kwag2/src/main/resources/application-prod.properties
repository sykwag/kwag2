# ===== Production Environment Configuration =====
# 운영 환경에서는 최소한의 로깅을 하고, 운영 데이터베이스 사용

# ===== Logging Level (Production: INFO/WARN) =====
logging.level.root=WARN
logging.level.kr.sy.kwag2=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.web=INFO
logging.level.org.mybatis=INFO

# ===== Swagger Configuration (Production: Disabled) =====
swagger.enabled=false

# ===== Database Configuration (Production: Production Server) =====
# 운영 환경의 실제 데이터베이스 접속 정보로 변경 필요
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://prod-db-server:3306/kwag2?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=true
jdbc.username=kwag2_user
jdbc.password=CHANGE_ME_TO_SECURE_PASSWORD
jdbc.pool.max=30
jdbc.pool.min=10

# 보조 데이터베이스 (운영 환경)
jdbc.secondary.driver=com.mysql.cj.jdbc.Driver
jdbc.secondary.url=jdbc:mysql://prod-db-server2:3306/kwag2_secondary?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=true
jdbc.secondary.username=kwag2_user
jdbc.secondary.password=CHANGE_ME_TO_SECURE_PASSWORD

# ===== File Upload Configuration (Production: NAS or Cloud Storage) =====
file.upload.path=/data/kwag2/uploads
file.upload.temp-path=/data/kwag2/temp

# ===== Session Configuration =====
session.timeout=1800
session.cookie.secure=true
session.cookie.httponly=true

# ===== Debug Mode (Production: Disabled) =====
debug=false

# ===== Performance Configuration =====
# 연결 풀 최대 대기 시간 (밀리초)
jdbc.connection.timeout=10000